version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: enosis-db
    environment:
      POSTGRES_USER: enosis
      POSTGRES_PASSWORD: enosis
      POSTGRES_DB: enosis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enosis"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: enosis-api
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://enosis:enosis@db:5432/enosis
      - DATABASE_URL_SYNC=postgresql://enosis:enosis@db:5432/enosis
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: enosis-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
    depends_on:
      - api
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
