<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Clinic CMS — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); width: 400px; }
        h1 { color: #1e40af; margin-bottom: 8px; font-size: 24px; }
        p { color: #64748b; margin-bottom: 24px; font-size: 14px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #334155; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #1d4ed8; }
        .hint { margin-top: 16px; font-size: 12px; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🏥 Clinic CMS</h1>
        <p>Mock Clinic Management System for Enosis Demo</p>
        <label for="username">Username</label>
        <input type="text" id="username" value="admin" placeholder="Username">
        <label for="password">Password</label>
        <input type="password" id="password" value="password" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
        <p class="hint">Click Login to enter (mock authentication)</p>
    </div>
    <script>
        function login() {
            localStorage.setItem('mock_cms_logged_in', 'true');
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
