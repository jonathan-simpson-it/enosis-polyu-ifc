name: Trading B2B Intelligence

on:
  push:
    branches:
      - trading-logistic-b2b-intelligence
    paths:
      - "app/deepbridge/**"
      - "components/trading/**"
      - "lib/trading/**"
      - "ml/**"
      - "data/trading/**"
      - "tests/trading/**"
      - "playwright.trading.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trading-b2b.yml"
  pull_request:
    paths:
      - "app/deepbridge/**"
      - "components/trading/**"
      - "lib/trading/**"
      - "ml/**"
      - "data/trading/**"
      - "tests/trading/**"
      - "playwright.trading.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trading-b2b.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m venv ml/.venv
          ml/.venv/bin/pip install -r ml/requirements.txt -r ml/requirements-dev.txt

      - name: Lint trading code
        run: npx eslint app/deepbridge components/trading lib/trading tests/trading

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Ingest pipeline
        run: npm run trading:ingest

      - name: Pytest suite
        run: npm run test:trading

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:trading:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trading-playwright-report
          path: tests/trading/report
          retention-days: 7